name: Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: |
          python -m compileall -q src tests

      - name: Run Lab Rescue Agent smoke test
        run: |
          PYTHONPATH="$PWD/src" python tests/test_demo_workflow.py

      - name: Run demo command
        run: |
          PYTHONPATH="$PWD/src" python -m lab_rescue_agent demo | grep -E 'Agent 7|Status: pass|Seven-agent'

      - name: Run export command
        run: |
          PYTHONPATH="$PWD/src" python -m lab_rescue_agent export
          test -f demo/output/az204-functions-storage-error_report.md
          test -f demo/output/az204-functions-storage-error_summary.json
          test -f demo/output/az204-functions-storage-error_dashboard.html
          test -f demo/output/az204-functions-storage-error_trace.json
          test -f demo/output/az204-functions-storage-error_manager_brief.md

      - name: Run Foundry readiness status command
        run: |
          PYTHONPATH="$PWD/src" python -m lab_rescue_agent foundry-status

      - name: Run evaluation harness
        run: |
          PYTHONPATH="$PWD/src" python -m lab_rescue_agent evaluate
